name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Smoke tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vlabs/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: vlabs

      - name: Run smoke tests
        run: npm test
        working-directory: vlabs

  build:
    name: Next.js build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vlabs/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: vlabs

      - name: Build
        run: npm run build
        working-directory: vlabs
